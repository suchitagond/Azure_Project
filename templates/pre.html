<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predefined Phrases</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(90deg, #0078d7, #005a9e);
            color: white;
            text-align: center;
            padding: 30px 0;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
        }

        main {
            padding: 40px 20px;
        }

        .card {
            margin: 0 auto;
            margin-bottom: 40px;
            max-width: 600px;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
        }

        .card-body {
            text-align: center;
            padding: 40px;
        }

        .instructions {
            text-align: left;
            margin-bottom: 30px;
            background: #eef6ff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        button, .btn-back {
            background-color: #0078d7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.2em;
            transition: background-color 0.3s ease;
        }

        .btn-back {
            background-color: #0078d7;
            color: white;
            border-radius: 20px;
            margin-top: 20%;
            margin-left: 44.5%;
        }

        button:hover, .btn-back:hover {
            background-color: #005a9e;
        }

        footer {
            background: #0078d7;
            color: white;
            text-align: center;
            padding: 10px 0;
            margin-top: 1.5%;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .card-body {
                padding: 20px;
            }

            button, .btn-back {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Predefined Phrases</h1>
    </header>
    <main>
        <div class="card">
            <div class="card-body">
                <div class="instructions">
                    <h5><strong>Instructions:</strong></h5>
                    <ul>
                        <li>Select a phrase from the dropdown list below.</li>
                        <li>Click "Speak Phrase" to hear it aloud.</li>
                    </ul>
                </div>

                <div>
                    <label for="predefinedPhrases" class="form-label"><strong>Select a Phrase:</strong></label>
                    <select id="predefinedPhrases" class="form-select mb-3">
                        <option value="" selected disabled>Select a phrase...</option>
                        <!-- Dynamically populated list of predefined phrases -->
                    </select>
                    <button id="sendPhraseButton" onclick="sendPredefinedPhrase()">Speak Phrase</button>
                </div>
                <div id="status" class="text-success mt-3"></div>
            </div>
        </div>

        <a href="/index" class="btn-back">Back to Home</a>
    </main>

    <footer>
        <p>&copy; 2025 Accessible App. All Rights Reserved.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const dropdown = document.getElementById("predefinedPhrases");

            // Fetch predefined phrases from the backend
            fetch('/get-predefined-phrases')
                .then(response => response.json())
                .then(data => {
                    data.phrases.forEach(phrase => {
                        const option = document.createElement('option');
                        option.value = phrase;
                        option.textContent = phrase;
                        dropdown.appendChild(option);
                    });
                })
                .catch(error => console.error('Error fetching predefined phrases:', error));
        });

        function sendPredefinedPhrase() {
            const selectedPhrase = document.getElementById("predefinedPhrases").value;

            if (!selectedPhrase) {
                alert("Please select a phrase!");
                return;
            }

            fetch('/process-input', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ input_type: "text", user_input: selectedPhrase })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        document.getElementById("status").textContent = "Phrase spoken successfully!";
                        playTextToSpeech(data.message);
                    } else {
                        document.getElementById("status").textContent = "Error processing phrase.";
                    }
                })
                .catch(error => {
                    console.error('Error processing phrase:', error);
                    document.getElementById("status").textContent = "Error processing phrase.";
                });
        }

        function playTextToSpeech(text) {
            const speech = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
