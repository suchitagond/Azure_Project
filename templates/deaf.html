
<!-- Page for Deaf Users -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deaf Features</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }
        .header {
            background-color: #28a745;
            text-align: center;
            color: white;
            margin-top: 0%;
            width: 100%;
            height: 150px;
            margin-bottom: 5%;
            padding-top: 20px;
        }
        .col-md-4{
            margin-left: 10%;
        }
        .feature-card {
            background-color: #d4edda;
            border: none;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .feature-card:hover {
            transform: scale(1.05);
        }
        .feature-icon {
            font-size: 50px;
            color: #28a745;
        }
        .btn-back {
            background-color: #28a745;
            color: white;
            border-radius: 20px;
            margin-top: 20px;
            margin-left: 43%;
        }
        footer {
            margin-top: 11%;
            background-color: #28a745;
            color: white;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="mb-4">Features for Deaf Users</h1>
        <p>Discover tools tailored to enhance accessibility for deaf users.</p>
    </div>
        <div class="container">
            <div class="row">
                <div class="col-md-4 mb-4">
                    <div class="card feature-card text-center p-4" onclick="window.location.href='/speech_to_text'">
                        <div class="feature-icon mb-3">📹</div>
                        <h5 class="card-title">Speech to Text</h5>
                        <p class="card-text">Converts spoken content into text.</p>
                    </div>
                </div>
    
                <div class="col-md-4 mb-4">
                    <div class="card feature-card text-center p-4" onclick="window.location.href='/translate'">
                        <div class="feature-icon mb-3">📝</div>
                        <h5 class="card-title">Translate Language</h5>
                        <p class="card-text">Translate the gien text into English.</p>
                    </div>
                </div>
            </div>
    
        </div>

            <a href="/index" class="btn btn-back">Back to Home</a>
        </div>

    <footer class="text-center">
        <p>&copy; 2025 Accessible App. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
