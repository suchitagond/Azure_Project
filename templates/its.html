<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Analysis with Text-to-Speech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(90deg, #0078d7, #005a9e);
            color: white;
            text-align: center;
            padding: 30px 0;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
        }

        main {
            padding: 40px 20px;
        }

        .card {
            margin: 0 auto;
            margin-bottom: 40px;
            max-width: 600px;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
        }

        .card-body {
            text-align: center;
            padding: 40px;
        }

        .instructions {
            text-align: left;
            margin-bottom: 30px;
            background: #eef6ff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .upload-container {
            margin: 20px 0;
        }

        button, .btn-back {
            background-color: #0078d7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.2em;
            transition: background-color 0.3s ease;
        }
        .btn-back{
            background-color: #0078d7;
            color: white;
            border-radius: 20px;
            margin-top: 20%;
            margin-left: 44.5%;
        }
        button:hover, .btn-back:hover {
            background-color: #005a9e;
        }

        #result-container {
            margin-top: 20px;
            display: none;
        }

        #result-text {
            font-size: 1.2em;
            color: #333;
        }

        footer {
            background: #0078d7;
            color: white;
            text-align: center;
            padding: 10px 0;
            margin-top: 0.01%;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .card-body {
                padding: 20px;
            }

            button, .btn-back {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Image Analysis & Text-to-Speech</h1>
    </header>
    <main>
        <div class="card">
            <div class="card-body">
                <div class="instructions">
                    <h5><strong>Instructions:</strong></h5>
                    <ul>
                        <li>Upload an image to extract text or receive a description.</li>
                        <li>The extracted or described text will be displayed and read aloud.</li>
                    </ul>
                </div>

                <div class="upload-container">
                    <form id="image-upload-form">
                        <label for="image" class="form-label"><strong>Select an image:</strong></label>
                        <input type="file" class="form-control" id="image" name="image" accept="image/*">
                        <button type="submit" class="mt-3">Analyze Image</button>
                    </form>
                </div>

                <div id="result-container" class="alert alert-info mt-4">
                    <p><strong>Result:</strong> <span id="result-text"></span></p>
                </div>
            </div>
        </div>

        <a href="/index" class="btn-back mt-4">Back to Home</a>
    </main>

    <footer>
        <p>&copy; 2025 Accessible App. All Rights Reserved.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const imageForm = document.getElementById("image-upload-form");
            const resultContainer = document.getElementById("result-container");
            const resultText = document.getElementById("result-text");

            imageForm.addEventListener("submit", async (event) => {
                event.preventDefault();
                const imageInput = document.getElementById("image").files[0];

                if (!imageInput) {
                    alert("Please select an image to upload.");
                    return;
                }

                const formData = new FormData();
                formData.append("image", imageInput);

                try {
                    const response = await fetch("/api/analyze_image", {
                        method: "POST",
                        body: formData,
                    });
                    const data = await response.json();

                    if (data.error) {
                        alert(data.error);
                    } else {
                        resultText.textContent = data.result;
                        resultContainer.style.display = "block";
                    }
                } catch (error) {
                    alert("An error occurred while analyzing the image. Please try again.");
                    console.error(error);
                }
            });
        });
    </script>
</body>
</html>
