<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mute Communication App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }
        .header {
            background-color: #ffc107;
            color: black;
            text-align: center;
            margin-top: 0px;
            width: 100%;
            height: 150px;
            margin-bottom: 5%;
            padding-top: 20px;
        }
        .col-md-4{
            margin-left: 10%;
        }
        .feature-card {
            background-color: #fff3cd;
            border: none;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
            cursor: pointer;
            height: 100%;
        }
        .feature-card:hover {
            transform: scale(1.05);
        }
        .feature-icon {
            font-size: 50px;
            color: #ffc107;
        }
        .btn-back {
            background-color: #ffc107;
            color: black;
            border-radius: 20px;
            margin-top: 20px;
            margin-left: 43%;
        }
        footer {
            margin-top: 9.2%;
            background-color: #ffc107;
            color: black;
            padding: 10px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <h1>Mute Communication App</h1>
        <p>Explore tools designed to assist with communication for mute users.</p>
    </div>

    <!-- Main Content Section -->
    <div class="container">
        <div class="row mb-4">
                        <!-- For Speech Synthesis -->
            <div class="col-md-4">
                <div class="card feature-card p-4" onclick="window.location.href='/speech-synthesis'">
                    <div class="feature-icon text-center">💬</div>
                    <h5 class="text-center">Speech Synthesis</h5>
                    <p class="text-center">Type text and convert it into spoken words.</p>
                </div>
            </div>

            <!-- For Predefined Phrases -->
            <div class="col-md-4">
                <div class="card feature-card p-4" onclick="window.location.href='/predefined-phrases'">
                    <div class="feature-icon text-center">📋</div>
                    <h5 class="text-center">Predefined Phrases</h5>
                    <p class="text-center">Quickly communicate using pre-saved common phrases.</p>
                </div>
            </div>
        </div>

        <!-- Back Button -->
        <a href="/index" class="btn btn-warning btn-back">Back to Home</a>
    </div>

    <!-- Footer Section -->
    <footer class="text-center">
        <p>&copy; 2025 Accessible App. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
